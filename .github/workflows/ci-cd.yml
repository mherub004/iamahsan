name: Deploy Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install
        working-directory: worker

      - name: Deploy worker code
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set secrets and route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_ADMIN: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_JWT: ${{ secrets.JWT_SECRET }}
          SECRET_GH: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error

          token   = os.environ["CLOUDFLARE_API_TOKEN"]
          account = "4f1b4e86acbe9b77219449ce6f88f008"
          worker  = "iamahsan-worker"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def cf(method, path, body=None):
            url = f"https://api.cloudflare.com/client/v4/{path}"
            data = json.dumps(body).encode() if body else None
            req = urllib.request.Request(url, data=data, method=method, headers=headers)
            with urllib.request.urlopen(req) as r:
              return json.load(r)

          # Set secrets
          secrets_url = f"accounts/{account}/workers/scripts/{worker}/secrets"
          for name, env_key in [("ADMIN_PASSWORD","SECRET_ADMIN"),("JWT_SECRET","SECRET_JWT"),("GH_TOKEN","SECRET_GH")]:
            cf("PUT", secrets_url, {"name": name, "text": os.environ[env_key], "type": "secret_text"})
            print(f"  secret {name}: ok")

          # Get zone ID for iamahsan.org
          zones = cf("GET", "zones?name=iamahsan.org")
          zone_id = zones["result"][0]["id"]
          print(f"  zone: {zone_id}")

          # Add route iamahsan.org/admin/* → iamahsan-worker
          try:
            routes = cf("GET", f"zones/{zone_id}/workers/routes")
            existing = [r for r in routes["result"] if "admin" in r.get("pattern","")]
            if existing:
              route_id = existing[0]["id"]
              cf("PUT", f"zones/{zone_id}/workers/routes/{route_id}", {"pattern": "iamahsan.org/admin/*", "script": worker})
              print(f"  route updated: ok")
            else:
              cf("POST", f"zones/{zone_id}/workers/routes", {"pattern": "iamahsan.org/admin/*", "script": worker})
              print(f"  route created: ok")
          except Exception as e:
            print(f"  route: {e} (may already be set)")
          EOF
