name: Deploy Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install
        working-directory: worker

      - name: Deploy worker code
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Get workers.dev URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -c "
          import json, os, urllib.request
          token = os.environ['CLOUDFLARE_API_TOKEN']
          account = '4f1b4e86acbe9b77219449ce6f88f008'
          req = urllib.request.Request(
            f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain',
            headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'}
          )
          with urllib.request.urlopen(req) as r:
            data = json.load(r)
            subdomain = data['result']['subdomain']
            print(f'WORKER_URL=https://iamahsan-worker.{subdomain}.workers.dev')
          "
