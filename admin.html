<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Ahsan</title>
  <!-- Load Clerk JS via your custom domain -->
  <script 
    async 
    data-clerk-publishable-key="pk_live_Y2xlcmsuaWFtYWhzYW4ub3JnJA" 
    src="https://clerk.iamahsan.org/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">

  <div id="app">
    <h2>🔒 Admin Portal</h2>
    <p>Please sign in to access confidential developer notes.</p>
    <div id="sign-in-button"></div>
  </div>

  <script>
    window.addEventListener('load', async function () {
      await Clerk.load();

      if (Clerk.user) {
        document.getElementById('app').innerHTML = `
          <h1>Welcome, ${Clerk.user.firstName}! 👋</h1>
          <p>System Status: <b>All Systems Operational</b></p>
          <div id="user-button"></div>
        `;
        Clerk.mountUserButton(document.getElementById('user-button'));
      } else {
        Clerk.mountSignIn(document.getElementById('sign-in-button'));
      }
    });
  </script>
</body>
</html>
