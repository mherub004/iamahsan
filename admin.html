<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Ahsan</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #09090b;
      color: #f4f4f5;
      margin: 0;
    }
    .card {
      text-align: center;
      background: #18181b;
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid #27272a;
      max-width: 400px;
      width: 90%;
    }
    #status {
      color: #a1a1aa;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="margin-top: 0;">🔒 Admin Portal</h2>
    <div id="status">Connecting to authentication server...</div>
    <div id="auth-container"></div>
  </div>

  <script>
    const PUBLISHABLE_KEY = "pk_live_Y2x1cmsuaWFTYWhzYW4ub3JnJA";

    async function initAuth() {
      const statusEl = document.getElementById('status');
      const container = document.getElementById('auth-container');

      try {
        // 1. Extract domain from key
        const clerkDomain = atob(PUBLISHABLE_KEY.split('_')[2]).slice(0, -1);

        // 2. Dynamically load Clerk JS & UI components
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `https://${clerkDomain}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`;
          script.setAttribute('data-clerk-publishable-key', PUBLISHABLE_KEY);
          script.crossOrigin = 'anonymous';
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });

        // 3. Initialize Clerk instance
        const clerk = window.Clerk;
        await clerk.load({
          ui: { ClerkUI: window.__internal_ClerkUICtor }
        });

        // 4. Render UI
        if (clerk.user) {
          statusEl.style.color = "#22c55e";
          statusEl.innerText = `Authenticated: ${clerk.user.primaryEmailAddress?.emailAddress}`;
          clerk.mountUserButton(container);
        } else {
          statusEl.innerText = "Please sign in with your admin credentials.";
          clerk.mountSignIn(container);
        }

      } catch (error) {
        console.error("Clerk Initialization Error:", error);
        statusEl.style.color = "#ef4444";
        statusEl.innerText = "Error loading security component. Check browser console (F12).";
      }
    }

    window.addEventListener('load', initAuth);
  </script>
</body>
</html>
