<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Ahsan</title>
</head>
<body style="font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 80vh; background-color: #09090b; color: #f4f4f5; margin: 0;">

  <div id="app" style="text-align: center; background: #18181b; padding: 2.5rem; border-radius: 12px; border: 1px solid #27272a; max-width: 400px; width: 90%;">
    <h2 style="margin-top: 0;">🔒 Admin Portal</h2>
    <p id="status-text" style="color: #a1a1aa; margin-bottom: 1.5rem;">Initializing security check...</p>
    <div id="auth-container"></div>
  </div>

  <!-- Load Clerk directly from official CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>

  <script>
    const PUBLISHABLE_KEY = "pk_live_Y2x1cmsuaWFTYWhzYW4ub3JnJA";

    window.addEventListener('load', async function () {
      const statusText = document.getElementById('status-text');
      const authContainer = document.getElementById('auth-container');

      try {
        // Initialize Clerk SDK
        const clerk = new Clerk(PUBLISHABLE_KEY);
        await clerk.load();

        if (clerk.user) {
          // Logged In State
          statusText.style.color = "#22c55e";
          statusText.innerText = `Authenticated as ${clerk.user.primaryEmailAddress?.emailAddress || 'Admin'}`;
          clerk.mountUserButton(authContainer);
        } else {
          // Logged Out State
          statusText.innerText = "Please sign in to access admin rights.";
          clerk.mountSignIn(authContainer);
        }
      } catch (err) {
        console.error("Clerk Init Error:", err);
        statusText.style.color = "#ef4444";
        statusText.innerText = "Failed to connect to Auth server. Please refresh.";
      }
    });
  </script>
</body>
</html>
